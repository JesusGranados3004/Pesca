<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="css/editar_producto.css">
</head>
<body>

    <h1>✏️ Editar Producto</h1>

    <!-- Botón volver -->
    <div style="max-width: 600px; margin: 0 auto 15px;">
        <a href="inventario.html" style="text-decoration: none; color: #0077b6; font-weight: bold;">
            ← Volver al inventario
        </a>
    </div>

    <form id="formEditarProducto" enctype="multipart/form-data">

        <input type="hidden" id="producto_id" name="id">

        <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>

        <textarea id="descripcion" name="descripcion" placeholder="Descripción"></textarea>

        <input type="number" step="0.01" id="precio" name="precio" placeholder="Precio" required>

        <input type="text" id="origen" name="origen" placeholder="Origen">

        <input type="text" id="pescador_responsable" name="pescador_responsable" placeholder="Pescador">

        <input type="number" step="0.01" id="cantidad" name="cantidad" placeholder="Cantidad">

        <input type="date" id="fecha" name="fecha">

        <input type="text" id="tipo_pesca" name="tipo_pesca" placeholder="Tipo de pesca">

        <select id="disponibilidad" name="disponibilidad">
            <option value="1">Disponible</option>
            <option value="0">No disponible</option>
        </select>

        <!-- Imagen actual -->
        <div style="text-align: center;">
            <p style="margin-bottom: 8px; color: #666; font-size: 14px;">Imagen actual:</p>
            <img id="imagenActual" src="" alt="Imagen del producto" 
                 style="max-width: 200px; max-height: 150px; border-radius: 8px; border: 1px solid #ddd; display: none;">
        </div>

        <input type="file" name="imagen">

        <button type="submit">💾 Guardar Cambios</button>

    </form>

    <script src="js/sesion.js"></script>
    <script src="js/editar_producto.js"></script>

</body>
</html>
