<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Compras - PescaDirecta</title>
    <link rel="stylesheet" href="css/mis_compras.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <nav>
        <a href="index.html" class="logo-link">
            <div class="logo"><i class="fas fa-fish"></i> PescaDirecta</div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div class="menu" id="menuNav">
            <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
            <a href="index.html#productos"><i class="fas fa-search"></i> Productos</a>
            <a href="mis_compras.html" class="active"><i class="fas fa-clipboard-list"></i> Mis Compras</a>
            <a href="pago.html"><i class="fas fa-shopping-cart"></i> Carrito</a>
        </div>
    </nav>

    <div class="container">
        <h1><i class="fas fa-clipboard-list"></i> Mis Compras</h1>
        
        <div id="comprasContainer"></div>
        
        <div id="sinCompras" class="sin-compras">
            <i class="fas fa-shopping-bag"></i>
            <h2>Aún no has realizado compras</h2>
            <p>Explora nuestros productos frescos y haz tu primera compra.</p>
            <a href="index.html#productos" class="btn-primario">Ver productos</a>
        </div>
    </div>

<script src="js/sesion.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        verificarSesion()
            .then(res => res.json())
            .then(sesion => {

                if (!sesion.logueado) {
                    mostrarToast('Debes iniciar sesión para ver tus compras', 'aviso');
                    setTimeout(() => {
                        window.location.href = 'iniciarSesion.html';
                    }, 2000);
                    return;
                }
                if (sesion.tipo !== 'consumidor') {
                    mostrarToast('Solo los compradores pueden acceder aquí', 'aviso');
                    setTimeout(() => {
                        window.location.href = 'index.html?_=' + Date.now();
                    }, 2000);
                    return;
                }

                cargarMisCompras();

            })
            .catch(() => {

                mostrarToast(
                    'Error verificando la sesión',
                    'error'
                );

                setTimeout(() => {
                    window.location.href = 'index.html?_=' + Date.now();
                }, 2000);

            });

    });

    function toggleMenu() {
        document.getElementById('menuNav').classList.toggle('activo');
    }
</script>

<script src="js/mis_compras.js"></script>
</body>
</html>
