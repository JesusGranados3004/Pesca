<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas - PescaDirecta</title>
    <link rel="stylesheet" href="css/inventario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <header class="inventario-header">
        <a href="index.html" class="logo-link">
            <div class="logo"><i class="fas fa-fish"></i> PescaDirecta</div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="menuNav">
            <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
            <a href="inventario.html"><i class="fas fa-box"></i> Inventario</a>
            <a href="historial_ventas.html" class="activo"><i class="fas fa-chart-bar"></i> Historial</a>
        </nav>
    </header>

    <div class="container">
        <div class="seccion">
            <h2><i class="fas fa-chart-bar"></i> Historial de Ventas</h2>
            <div class="tabla-contenedor">
                <table id="tablaVentas">
                    <thead>
                        <tr>
                            <th>PRODUCTO</th>
                            <th>CLIENTE</th>
                            <th>CANTIDAD</th>
                            <th>TOTAL</th>
                            <th>FECHA</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/sesion.js"></script>
    <script src="js/historial_ventas.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('menuNav').classList.toggle('activo');
        }
    </script>
</body>
</html>
