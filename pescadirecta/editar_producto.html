<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="css/editar_producto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo-link">
            <div class="logo"><i class="fas fa-fish"></i> PescaDirecta</div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div class="menu" id="menuNav">
            <a href="inventario.html"><i class="fas fa-box"></i> Inventario</a>
            <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
        </div>
    </nav>

    <div class="contenedor">

        <div class="header-editar">
            <a href="inventario.html" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver</a>
            <h1><i class="fas fa-pen"></i> Editar Producto</h1>
        </div>

        <div class="selector-modo">
            <p class="titulo-modo">¿Qué deseas hacer?</p>
            <div class="opciones-modo">
                <label class="opcion-modo activa">
                    <input type="radio" name="modo_edicion" value="correccion" checked onchange="cambiarModo(this.value)">
                    <span class="icono"><i class="fas fa-pen-square"></i></span>
                    <span class="texto-opcion">Corrección</span>
                    <span class="desc-opcion">Editar datos del producto</span>
                </label>
                <label class="opcion-modo">
                    <input type="radio" name="modo_edicion" value="stock" onchange="cambiarModo(this.value)">
                    <span class="icono"><i class="fas fa-box"></i></span>
                    <span class="texto-opcion">Agregar Stock</span>
                    <span class="desc-opcion">Añadir kilos + foto obligatoria</span>
                </label>
            </div>
        </div>

        <form id="formEditarProducto" enctype="multipart/form-data">

            <input type="hidden" id="producto_id" name="id">
            <input type="hidden" id="modo" name="modo" value="correccion">

            <div class="grid-campos" id="camposCorreccion">

                <div class="campo">
                    <label for="nombre">Nombre del producto</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Mojarra" required>
                </div>

                <div class="campo campo-full">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Describe el producto..." rows="3"></textarea>
                </div>

                <div class="campo">
                    <label for="precio">Precio ($)</label>
                    <input type="number" step="0.01" id="precio" name="precio" placeholder="0.00" required>
                </div>

                <div class="campo">
                    <label for="origen">Origen</label>
                    <input type="text" id="origen" name="origen" placeholder="Ej: Santa Marta">
                </div>

                <div class="campo">
                    <label for="pescador_responsable">Pescador responsable</label>
                    <input type="text" id="pescador_responsable" name="pescador_responsable" placeholder="Nombre del pescador">
                </div>

                <div class="campo">
                    <label for="tipo_pesca">Tipo de pesca</label>
                    <input type="text" id="tipo_pesca" name="tipo_pesca" placeholder="Ej: Artesanal">
                </div>

                <div class="campo">
                    <label for="disponibilidad">Estado</label>
                    <select id="disponibilidad" name="disponibilidad">
                        <option value="1">Disponible</option>
                        <option value="0">No disponible</option>
                    </select>
                </div>

            </div>

            <div class="campo cantidad-destacada" id="campoCantidad">
                <label for="cantidad" id="labelCantidad">Cantidad (kg)</label>
                <input type="number" step="0.01" id="cantidad" name="cantidad" placeholder="0.00" required>
                <small id="hintCantidad">Edita la cantidad total disponible</small>
            </div>

            <div class="campo fecha-captura" id="campoFecha">
                <label for="fecha">
                    Fecha de captura
                    <span class="requerido-fecha" id="requeridoFecha" style="display: none; color: #e74c3c;"> *</span>
                </label>
                <input type="date" id="fecha" name="fecha" required>
                <small id="hintFecha">Fecha en que se pescó el producto</small>
            </div>

            <div class="seccion-imagen">
                <p class="titulo-seccion">Imagen actual</p>
                <div class="imagen-actual">
                    <img id="imagenActual" src="" alt="Imagen del producto">
                </div>
            </div>

            <div class="seccion-imagen nueva">
                <p class="titulo-seccion">
                    Nueva imagen
                    <span class="requerido" id="requeridoImagen">* Obligatoria</span>
                </p>
                <div class="zona-subida">
                    <input type="file" name="imagen" id="inputImagen" accept="image/*">
                    <small id="hintImagen">Deja vacío para mantener la imagen actual</small>
                </div>
            </div>

            <div class="acciones-form">
                <button type="submit" id="btnGuardar" class="btn-guardar"><i class="fas fa-save"></i> Guardar Cambios</button>
            </div>

        </form>

    </div>

    <script>
        function toggleMenu() {
            document.getElementById('menuNav').classList.toggle('activo');
        }
    </script>
    <script src="js/sesion.js"></script>
    <script src="js/editar_producto.js"></script>

</body>
</html>
