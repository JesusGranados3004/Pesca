<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - PescaDirecta</title>
    <link rel="stylesheet" href="css/tienda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <header class="tienda-header">
        <a href="index.html" class="logo-link">
            <div class="logo"><i class="fas fa-fish"></i> PescaDirecta</div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="menuNav">
            <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
            <a href="pago.html" class="activo"><i class="fas fa-shopping-cart"></i> Carrito</a>
        </nav>
    </header>

    <div class="container carrito-container">
        <h1 style="margin-bottom: 30px; color: #0077b6;"><i class="fas fa-shopping-cart"></i> Tu Carrito</h1>
        
        <div class="carrito-layout">
            <div>
                <div id="carritoItems"></div>
                <div id="carritoVacio" class="carrito-vacio" style="display: none;">
                    <i class="fas fa-shopping-cart"></i>
                    <h2><i class="fas fa-shopping-cart"></i> Tu carrito está vacío</h2>
                    <p>Explora nuestros productos frescos.</p>
                    <a href="index.html#productos">← Ver productos</a>
                </div>
            </div>
            
            <div id="carritoResumen" class="cart-summary" style="display: none;">
                <h3><i class="fas fa-receipt"></i> Resumen de Compra</h3>
                
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotalCarrito">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío</span>
                    <span id="envioCarrito">Gratis</span>
                </div>
                <hr style="border: none; border-top: 1px solid #ddd; margin: 15px 0;">
                <div class="summary-row total">
                    <strong>Total</strong>
                    <strong id="totalCarrito">$0.00</strong>
                </div>
                
                <p id="mensajeStock" style="color: #e74c3c; display: none; margin-top: 10px;"><i class="fas fa-exclamation-triangle"></i> Revisa las cantidades</p>
                
                <button class="btn-pagar" id="btnPagar" onclick="procederPago()">
                    <i class="fas fa-lock"></i> <i class="fas fa-credit-card"></i> Proceder al pago
                </button>
                <button class="btn-vaciar" onclick="vaciarCarrito()">
                    <i class="fas fa-trash"></i> Vaciar Carrito
                </button>
            </div>
        </div>
    </div>

    <div id="modalPago" class="modal-pago" aria-hidden="true">
        <div class="modal-pago-contenido">
            <button class="modal-pago-cerrar" type="button" onclick="cerrarModalPago()">×</button>
            <h2><i class="fas fa-credit-card"></i> Datos de pago</h2>
            <p>Ingresa los datos de tu tarjeta para simular el pago.</p>
            <form id="formPago" class="modal-pago-form" onsubmit="enviarPago(event)">
                <label>
                    Nombre en tarjeta
                    <input id="tarjetaNombre" type="text" placeholder="Nombre completo" required>
                </label>
                <label>
                    Número de tarjeta
                    <input id="tarjetaNumero" type="text" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" required>
                </label>
                <div class="modal-row">
                    <label>
                        Expiración
                        <input id="tarjetaExpiracion" type="text" maxlength="5" placeholder="MM/AA" required>
                    </label>
                    <label>
                        CVV
                        <input id="tarjetaCvv" type="text" inputmode="numeric" maxlength="4" placeholder="123" required>
                    </label>
                </div>
                <div class="modal-pago-status" id="pagoStatus">Total a pagar: <strong id="modalTotalPago">$0.00</strong></div>
                <button class="btn-pagar" id="btnConfirmarPago" type="submit">
                    <i class="fas fa-paper-plane"></i> Pagar ahora
                </button>
            </form>
        </div>
    </div>

    <script src="js/tienda.js"></script>
    <script src="js/sesion.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('menuNav').classList.toggle('activo');
        }

        document.addEventListener('DOMContentLoaded', () => {
            verificarSesion()
        });
    </script>
</body>
</html>
